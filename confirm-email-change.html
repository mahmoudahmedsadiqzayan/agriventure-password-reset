<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>تأكيد تغيير البريد الإلكتروني - AGRIVENTOUR</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:#101827;color:#fff;font-family:Arial,Tahoma,sans-serif}main{width:min(100%,520px);padding:32px 26px;border-radius:24px;background:#1d293b}.brand{text-align:center;font-family:Georgia,serif;font-style:italic;font-size:clamp(25px,6vw,34px);color:#f8fafc;margin-bottom:8px}h1{text-align:center;font-size:clamp(27px,5vw,36px);line-height:1.45;margin:0 0 24px}p{color:#cbd5e1;line-height:1.8;font-size:18px;overflow-wrap:anywhere}input,button{width:100%;padding:14px;margin-top:13px;border-radius:9px;font-size:16px}input{border:1px solid #64748b;background:#fff;color:#111}button{border:0;background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#86efac!important}.err{color:#fca5a5!important}
</style></head><body><main><div class="brand">AgriVentures</div><h1>تأكيد تغيير البريد الإلكتروني</h1><p id="description">جارٍ التحقق من رابط تأكيد البريد الإلكتروني. من فضلك انتظر.</p><p id="message" role="status" aria-live="polite"></p></main><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://eaorwzdjcufhvrxezgpf.supabase.co","sb_publishable_xpIjzn9-dE5tbSsWKE3m5w_W73xWKSN");
const $=id=>document.getElementById(id);
function show(text,kind=""){$('message').textContent=text;$('message').className=kind;}
async function run(){
 try{
  const query=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.replace(/^#/,""));
  const type=(query.get("type")||hash.get("type")||"").toLowerCase();
  const code=query.get("code");
  if(code){const {error}=await supabase.auth.exchangeCodeForSession(code);if(error)throw error;}
  else {
   const tokenHash=query.get("token_hash")||hash.get("token_hash");
   if(tokenHash){const {error}=await supabase.auth.verifyOtp({token_hash:tokenHash,type:"email_change"});if(error)throw error;}
  }
  const {data,error}=await supabase.auth.getSession();if(error)throw error;
  if(!data.session?.user){throw new Error("رابط التأكيد غير صالح أو انتهت صلاحيته. اطلب رسالة تغيير بريد جديدة وافتح أحدث رابط وصل إليك.");}
  // Email-change links can identify themselves through type=email_change. If the provider
  // omits the type, the confirmation page still confirms the authenticated link/session.
  $('description').textContent="تمت معالجة رابط تأكيد البريد الإلكتروني.";
  show("تم التحقق من رابط التأكيد. إذا كان Supabase يتطلب تأكيدًا من البريد القديم والجديد، افتح الرسالتين وأكمل التأكيد المطلوب. بعد ذلك سجّل الدخول بالبريد المعتمد.","ok");
  history.replaceState({},document.title,location.pathname);
 }catch(e){show(e?.message||"تعذر تأكيد البريد الإلكتروني. اطلب رابطًا جديدًا وحاول مرة أخرى.","err");}
}
run();
</script></body></html>
