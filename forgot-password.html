
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نسيت كلمة المرور - AGRIVENTOUR</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:white;font-family:Arial,sans-serif}
main{width:min(88%,400px);padding:26px;border-radius:16px;background:#1d293b;box-sizing:border-box}
h2{text-align:center}
p{color:#cbd5e1;line-height:1.8}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:14px;border-radius:8px;font-size:16px}
input{border:1px solid #64748b;background:white;color:#111}
button{border:0;background:#2563eb;color:white;cursor:pointer}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>نسيت كلمة المرور؟</h2>
<p>اكتب البريد الإلكتروني المسجل بحسابك في AGRIVENTOUR، وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p>
<form id="form">
<input id="email" type="email" placeholder="البريد الإلكتروني" required>
<button id="send" type="submit">إرسال رابط الاستعادة</button>
</form>
<p id="message"></p>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://eaorwzdjcufhvrxezgpf.supabase.co";
const SUPABASE_PUBLIC_KEY = "sb_publishable_xpIjzn9-dE5tbSsWKE3m5w_W73xWKSN";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);
const form = document.getElementById("form");
const message = document.getElementById("message");
const send = document.getElementById("send");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  send.disabled = true;
  message.textContent = "جارٍ إرسال الرسالة...";

  try {
    const email = document.getElementById("email").value.trim();
    const redirectTo =
      "https://mahmoudahmedsadiqzayan.github.io/agriventure-password-reset/reset-password.html";

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo
    });

    if (error) throw error;

    message.textContent =
      "لو البريد مسجل، هتوصلك رسالة استعادة. افتحها واتبع الرابط.";
  } catch (error) {
    message.textContent =
      error.message || "تعذر إرسال الرسالة. حاول مرة أخرى.";
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
