<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>تعيين كلمة المرور - AGRIVENTOUR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(88%, 380px);
      padding: 25px;
      border-radius: 16px;
      background: #1d293b;
      box-sizing: border-box;
    }
    h2 { text-align: center; }
    .brand { text-align:center; font-family: Georgia,serif; font-style:italic; font-size:clamp(25px,6vw,34px); color:#f8fafc; margin-bottom:8px }
    p { color: #cbd5e1; line-height: 1.7; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #64748b;
      background: #fff;
      color: #111;
    }
    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; }
  
/* Locked brand asset: exact supplied logo, transparent background; no separately rendered tagline. */
.brand-lockup{width:100%;text-align:center;margin:0 auto 24px;display:flex;justify-content:center;align-items:center;overflow:visible}
.brand-logo{display:block;width:min(100%,380px);max-width:380px;height:auto;max-height:none;object-fit:contain;mix-blend-mode:normal;filter:none}
.brand-tagline{display:none!important}
</style>
<style>
.brand-lockup{width:100%;text-align:center;margin:0 auto 24px;display:flex;flex-direction:column;align-items:center;gap:2px}
.brand-logo{display:block;width:min(78%,310px);max-height:105px;object-fit:contain}
.brand-tagline{font-family:Arial,Tahoma,sans-serif;font-style:italic;font-size:clamp(9px,2.25vw,11px);line-height:1.2;color:#d96b7c;letter-spacing:0;text-align:left;white-space:nowrap;align-self:flex-start;margin-left:36%;margin-top:-1px}
body{background:radial-gradient(ellipse at 50% 0%,#193453 0%,#0b1729 68%,#081323 100%)!important;padding:22px!important}
main{width:min(100%,520px)!important;padding:30px 24px!important;border-radius:24px!important;background:linear-gradient(145deg,rgba(31,57,88,.94),rgba(16,35,57,.97))!important;border:1px solid rgba(100,155,210,.28);box-shadow:0 14px 38px rgba(0,0,0,.18)}
h1,h2{margin-top:0;line-height:1.45}
p{font-size:17px;line-height:1.8}
input,button{border-radius:13px!important;padding:15px!important;margin-top:12px!important}
button{background:linear-gradient(110deg,#1479ff,#064be8)!important;font-weight:700}
</style></head>

  <h2 id="pageTitle">تعيين كلمة المرور</h2>
  <p id="pageDescription">
    أنشئ كلمة مرور للدخول إلى شركة AGRIVENTOUR.
  </p>

  <form id="form" hidden>
    <input id="username" type="text" autocomplete="username"
      placeholder="اسم المستخدم" minlength="3" maxlength="40"
      pattern="[A-Za-z0-9_.-]{3,40}" hidden>

    <input id="password" type="password"
      placeholder="كلمة المرور الجديدة"
      minlength="8" autocomplete="new-password" required>

    <input id="confirm" type="password"
      placeholder="تأكيد كلمة المرور"
      minlength="8" autocomplete="new-password" required>

    <button id="save" type="submit">حفظ كلمة المرور</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://eaorwzdjcufhvrxezgpf.supabase.co";

  const SUPABASE_PUBLIC_KEY =
    "sb_publishable_xpIjzn9-dE5tbSsWKE3m5w_W73xWKSN";

  const $ = (id) => document.getElementById(id);
  const message = $("message");
  const form = $("form");
  const save = $("save");

  // Disable automatic URL detection because initialize() handles each
  // Supabase callback format explicitly below. This prevents the PKCE code
  // from being consumed automatically and then exchanged a second time.
  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY,
    {
      auth: {
        detectSessionInUrl: false,
        persistSession: true,
        autoRefreshToken: true,
        flowType: "pkce"
      }
    }
  );

  const query = new URLSearchParams(location.search);
  const hash = new URLSearchParams(
    location.hash.replace(/^#/, "")
  );

  const flowType = (
    query.get("type") || hash.get("type") || ""
  ).toLowerCase();

  let mode = flowType === "invite"
    ? "invite"
    : flowType === "email_change"
      ? "email"
      : "recovery";

  function show(text, kind = "") {
    message.textContent = text;
    message.style.color =
      kind === "error" ? "#fca5a5"
      : kind === "success" ? "#86efac"
      : "#cbd5e1";
  }

  function setMode() {
    if (mode === "invite") {
      document.title =
        "تعيين كلمة المرور للدخول إلى الشركة - AGRIVENTOUR";

      $("pageTitle").textContent =
        "تعيين كلمة المرور للدخول إلى الشركة";

      $("pageDescription").textContent =
        "أنشئ كلمة مرور لحسابك الجديد للانضمام إلى شركة AGRIVENTOUR.";

      save.textContent =
        "تعيين اسم المستخدم وكلمة المرور وتفعيل الحساب";
      $("username").hidden = false;
      $("username").required = true;

    } else if (mode === "email") {
      document.title =
        "تأكيد تغيير البريد الإلكتروني - AGRIVENTOUR";

      $("pageTitle").textContent =
        "تأكيد تغيير البريد الإلكتروني";

      $("pageDescription").textContent =
        "جارٍ التحقق من رابط تأكيد البريد الإلكتروني الخاص بحسابك.";

    } else {
      document.title =
        "استعادة كلمة المرور - AGRIVENTOUR";

      $("pageTitle").textContent =
        "استعادة كلمة المرور";

      $("pageDescription").textContent =
        "اكتب كلمة المرور الجديدة لحسابك في AGRIVENTOUR.";

      save.textContent = "حفظ كلمة المرور الجديدة";
    }
  }

  async function initialize() {
    setMode();

    try {
      // Exchange the one-time PKCE code returned by Supabase email links.
      const code = query.get("code");
      if (code) {
        const { error: exchangeError } = await supabase.auth.exchangeCodeForSession(code);
        if (exchangeError) throw exchangeError;
      } else {
        const tokenHash = query.get("token_hash") || hash.get("token_hash");
        if (tokenHash) {
          const otpType = mode === "invite" ? "invite" : mode === "email" ? "email_change" : "recovery";
          const { error: verifyError } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: otpType });
          if (verifyError) throw verifyError;
        } else {
          // Support Supabase implicit-flow links that return tokens in the URL hash.
          const accessToken = hash.get("access_token");
          const refreshToken = hash.get("refresh_token");
          const linkError =
            hash.get("error_description") || query.get("error_description") ||
            hash.get("error") || query.get("error") ||
            hash.get("error_code") || query.get("error_code");

          if (linkError) {
            throw new Error(linkError);
          }

          if (accessToken && refreshToken) {
            const { error: sessionError } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
            if (sessionError) throw sessionError;
          }
        }
      }

      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error) throw error;

      if (mode === "email") {
        form.hidden = true;

        if (session?.user) {
          show(
            "تم التحقق من رابط تغيير البريد. إذا طلبت Supabase تأكيدًا إضافيًا، راجع بريدك الإلكتروني واتبع التعليمات.",
            "success"
          );
        } else {
          show(
            "لم يتم العثور على جلسة صالحة. افتح رابط تأكيد البريد الذي وصلك، وتأكد من عدم انتهاء صلاحيته.",
            "error"
          );
        }
        return;
      }

      if (!session?.access_token) {
        form.hidden = true;
        show(
          "الرابط غير صالح أو انتهت صلاحيته. اطلب رابط دعوة جديدًا أو رابط استعادة جديدًا ثم افتحه من البريد.",
          "error"
        );
        return;
      }

      form.hidden = false;

      show(
        mode === "invite"
          ? "تم التحقق من رابط الدعوة. عيّن كلمة المرور لإكمال إعداد حسابك."
          : "تم التحقق من رابط الاستعادة. يمكنك تعيين كلمة مرور جديدة."
      );

    } catch (error) {
      form.hidden = true;
      show(
        error?.message ||
        "تعذر التحقق من الرابط. اطلب رابطًا جديدًا وحاول مرة أخرى.",
        "error"
      );
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = $("password").value;
    const confirm = $("confirm").value;
    const username = $("username").value.trim();

    if (mode === "invite" && !/^[A-Za-z0-9_.-]{3,40}$/.test(username)) {
      show("اسم المستخدم لازم يكون من 3 إلى 40 حرفًا/رقمًا، ويسمح بـ . _ - فقط.", "error");
      $("username").focus();
      return;
    }

    if (password.length < 8) {
      show(
        "كلمة المرور لازم تكون 8 أحرف على الأقل.",
        "error"
      );
      return;
    }

    if (password !== confirm) {
      show("كلمتا المرور غير متطابقتين.", "error");
      return;
    }

    save.disabled = true;
    show("جارٍ تحديث كلمة المرور...");

    try {
      const update = mode === "invite"
        ? { password, data: { username } }
        : { password };
      const { data, error } =
        await supabase.auth.updateUser(update);

      if (error) throw error;

      if (!data?.user) {
        throw new Error("لم يتم تأكيد تحديث الحساب.");
      }

      show(
        mode === "invite"
          ? "تم تعيين كلمة المرور بنجاح. أصبح بإمكانك تسجيل الدخول إلى AGRIVENTOUR."
          : "تم تحديث كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.",
        "success"
      );

      form.reset();
      form.hidden = true;

    } catch (error) {
      show(
        error?.message ||
        "تعذر تحديث كلمة المرور. افتح رابط الدعوة أو الاستعادة من جديد.",
        "error"
      );
    } finally {
      save.disabled = false;
    }
  });

  initialize();
</script>
</body>
</html>
