
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة المرور - AGRIVENTOUR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(88%, 380px);
      padding: 25px;
      border-radius: 16px;
      background: #1d293b;
      box-sizing: border-box;
    }
    h2 { text-align: center; }
    p { color: #cbd5e1; line-height: 1.7; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #64748b; background: #fff; color: #111; }
    button { border: 0; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>استعادة كلمة المرور</h2>
  <p>اكتب كلمة المرور الجديدة لحسابك في AGRIVENTOUR.</p>
  <form id="form">
    <input id="password" type="password" placeholder="كلمة المرور الجديدة" minlength="8" required>
    <input id="confirm" type="password" placeholder="تأكيد كلمة المرور" minlength="8" required>
    <button id="save" type="submit">حفظ كلمة المرور</button>
  </form>
  <p id="message"></p>
</main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://eaorwzdjcufhvrxezgpf.supabase.co";

  // سنضع المفتاح العام للمشروع هنا بعد التأكد من نوعه.
  const SUPABASE_PUBLIC_KEY = "PUT_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";

  const message = document.getElementById("message");
  const form = document.getElementById("form");
  const save = document.getElementById("save");

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (password.length < 8) {
      message.textContent = "كلمة المرور لازم تكون 8 أحرف على الأقل.";
      return;
    }

    if (password !== confirm) {
      message.textContent = "كلمتا المرور غير متطابقتين.";
      return;
    }

    save.disabled = true;
    message.textContent = "جارٍ تحديث كلمة المرور...";

    try {
      const { error } = await supabase.auth.updateUser({ password });

      if (error) throw error;

      message.textContent = "تم تحديث كلمة المرور. يمكنك تسجيل الدخول الآن.";
      form.reset();
    } catch (error) {
      message.textContent =
        error.message || "تعذر تحديث كلمة المرور. افتح رابط الاستعادة من جديد.";
    } finally {
      save.disabled = false;
    }
  });
</script>
</body>
</html>
