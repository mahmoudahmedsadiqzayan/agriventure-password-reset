<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>تعيين كلمة المرور - AGRIVENTOUR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(88%, 380px);
      padding: 25px;
      border-radius: 16px;
      background: #1d293b;
      box-sizing: border-box;
    }
    h2 { text-align: center; }
    p { color: #cbd5e1; line-height: 1.7; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #64748b;
      background: #fff;
      color: #111;
    }
    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2 id="pageTitle">تعيين كلمة المرور</h2>
  <p id="pageDescription">
    أنشئ كلمة مرور للدخول إلى شركة AGRIVENTOUR.
  </p>

  <form id="form" hidden>
    <input id="password" type="password"
      placeholder="كلمة المرور الجديدة"
      minlength="8" autocomplete="new-password" required>

    <input id="confirm" type="password"
      placeholder="تأكيد كلمة المرور"
      minlength="8" autocomplete="new-password" required>

    <button id="save" type="submit">حفظ كلمة المرور</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://eaorwzdjcufhvrxezgpf.supabase.co";

  const SUPABASE_PUBLIC_KEY =
    "sb_publishable_xpIjzn9-dE5tbSsWKE3m5w_W73xWKSN";

  const $ = (id) => document.getElementById(id);
  const message = $("message");
  const form = $("form");
  const save = $("save");

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );

  const query = new URLSearchParams(location.search);
  const hash = new URLSearchParams(
    location.hash.replace(/^#/, "")
  );

  const flowType = (
    query.get("type") || hash.get("type") || ""
  ).toLowerCase();

  let mode = flowType === "invite"
    ? "invite"
    : flowType === "email_change"
      ? "email"
      : "recovery";

  function show(text, kind = "") {
    message.textContent = text;
    message.style.color =
      kind === "error" ? "#fca5a5"
      : kind === "success" ? "#86efac"
      : "#cbd5e1";
  }

  function setMode() {
    if (mode === "invite") {
      document.title =
        "تعيين كلمة المرور للدخول إلى الشركة - AGRIVENTOUR";

      $("pageTitle").textContent =
        "تعيين كلمة المرور للدخول إلى الشركة";

      $("pageDescription").textContent =
        "أنشئ كلمة مرور لحسابك الجديد للانضمام إلى شركة AGRIVENTOUR.";

      save.textContent =
        "تعيين كلمة المرور وتفعيل الحساب";

    } else if (mode === "email") {
      document.title =
        "تأكيد تغيير البريد الإلكتروني - AGRIVENTOUR";

      $("pageTitle").textContent =
        "تأكيد تغيير البريد الإلكتروني";

      $("pageDescription").textContent =
        "جارٍ التحقق من رابط تأكيد البريد الإلكتروني الخاص بحسابك.";

    } else {
      document.title =
        "استعادة كلمة المرور - AGRIVENTOUR";

      $("pageTitle").textContent =
        "استعادة كلمة المرور";

      $("pageDescription").textContent =
        "اكتب كلمة المرور الجديدة لحسابك في AGRIVENTOUR.";

      save.textContent = "حفظ كلمة المرور الجديدة";
    }
  }

  async function initialize() {
    setMode();

    try {
      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error) throw error;

      if (mode === "email") {
        form.hidden = true;

        if (session?.user) {
          show(
            "تم التحقق من رابط تغيير البريد. إذا طلبت Supabase تأكيدًا إضافيًا، راجع بريدك الإلكتروني واتبع التعليمات.",
            "success"
          );
        } else {
          show(
            "لم يتم العثور على جلسة صالحة. افتح رابط تأكيد البريد الذي وصلك، وتأكد من عدم انتهاء صلاحيته.",
            "error"
          );
        }
        return;
      }

      if (!session?.access_token) {
        form.hidden = true;
        show(
          "الرابط غير صالح أو انتهت صلاحيته. اطلب رابط دعوة جديدًا أو رابط استعادة جديدًا ثم افتحه من البريد.",
          "error"
        );
        return;
      }

      form.hidden = false;

      show(
        mode === "invite"
          ? "تم التحقق من رابط الدعوة. عيّن كلمة المرور لإكمال إعداد حسابك."
          : "تم التحقق من رابط الاستعادة. يمكنك تعيين كلمة مرور جديدة."
      );

    } catch (error) {
      form.hidden = true;
      show(
        error?.message ||
        "تعذر التحقق من الرابط. اطلب رابطًا جديدًا وحاول مرة أخرى.",
        "error"
      );
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = $("password").value;
    const confirm = $("confirm").value;

    if (password.length < 8) {
      show(
        "كلمة المرور لازم تكون 8 أحرف على الأقل.",
        "error"
      );
      return;
    }

    if (password !== confirm) {
      show("كلمتا المرور غير متطابقتين.", "error");
      return;
    }

    save.disabled = true;
    show("جارٍ تحديث كلمة المرور...");

    try {
      const { data, error } =
        await supabase.auth.updateUser({ password });

      if (error) throw error;

      if (!data?.user) {
        throw new Error("لم يتم تأكيد تحديث الحساب.");
      }

      show(
        mode === "invite"
          ? "تم تعيين كلمة المرور بنجاح. أصبح بإمكانك تسجيل الدخول إلى AGRIVENTOUR."
          : "تم تحديث كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.",
        "success"
      );

      form.reset();
      form.hidden = true;

    } catch (error) {
      show(
        error?.message ||
        "تعذر تحديث كلمة المرور. افتح رابط الدعوة أو الاستعادة من جديد.",
        "error"
      );
    } finally {
      save.disabled = false;
    }
  });

  initialize();
</script>
</body>
</html>
